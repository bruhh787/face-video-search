name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download ArcFace model (InsightFace buffalo_l, w600k_r50, ~170 MB)
        run: |
          mkdir -p app/src/main/assets
          F=app/src/main/assets/arcface.onnx
          if [ ! -f "$F" ]; then
            curl -L --fail --retry 3 -o buffalo.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
            unzip -o -j buffalo.zip w600k_r50.onnx -d /tmp/model
            mv /tmp/model/w600k_r50.onnx "$F"
            # Lighter/faster alternative (13 MB): use buffalo_sc.zip and w600k_mbf.onnx instead.
          fi
          ls -la app/src/main/assets
          test "$(stat -c%s "$F")" -gt 10000000

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: face-video-search-apk
          path: app/build/outputs/apk/debug/app-debug.apk
